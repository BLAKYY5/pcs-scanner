name: Build PCS Scanner

# Every push to main builds the app. The version comes from VERSION in scanner/pcs_scan.py:
# if no release exists yet for that version, the build publishes one (tag v<version>),
# and players' apps offer it as an update. Same version again = test build only (see the run's "Artifacts").
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.8

      - name: Get ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffx
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Get-ChildItem -Recurse ffx -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination ffmpeg

      - name: Write build settings (version, Google sign-in ID, coach)
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
          COACH_EMAIL: ${{ vars.COACH_EMAIL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $code = (Select-String -Path scanner/pcs_scan.py -Pattern "^VERSION = '(.+)'").Matches[0].Groups[1].Value
          $exists = $true
          try { Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$code" | Out-Null } catch { $exists = $false }
          $release = ((-not $exists) -and ("${{ github.ref_name }}" -eq "main")) -or ("${{ github.ref_type }}" -eq "tag")
          $ver = if ($release) { $code } else { "dev-${{ github.run_number }}" }
          "RELEASE=$release" | Out-File -FilePath $env:GITHUB_ENV -Append
          @{ version = $ver; repo = "${{ github.repository }}"; coach = $env:COACH_EMAIL } | ConvertTo-Json | Set-Content -Encoding utf8 build.json
          if ($env:GOOGLE_OAUTH_CLIENT) { $env:GOOGLE_OAUTH_CLIENT | Set-Content -Encoding utf8 client.json } else { Write-Warning "No GOOGLE_OAUTH_CLIENT secret: the app will scan but cannot upload." }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build the .exe
        shell: pwsh
        run: |
          $data = @("scanner/pcs_maps.json;.", "scanner/pcs_fonts.json;.", "scanner/rank_rp.npy;.", "build.json;.", "ffmpeg;ffmpeg")
          if (Test-Path client.json) { $data += "client.json;." }
          $args = @("--noconfirm", "--onefile", "--windowed", "--name", "PCS-Scanner", "--paths", "scanner", "--hidden-import", "pcs_scan", "--hidden-import", "pcs_hud", "--collect-submodules", "numpy", "--collect-submodules", "scipy.ndimage", "--collect-all", "tkinterdnd2")
          foreach ($d in $data) { $args += @("--add-data", $d) }
          pyinstaller @args app/pcs_app.py

      - name: Test the .exe (libraries load, ffmpeg and sign-in ID bundled)
        shell: pwsh
        run: |
          Start-Process -FilePath dist/PCS-Scanner.exe -ArgumentList "--selftest", "$PWD\selftest.txt" -Wait
          $r = Get-Content selftest.txt -Raw
          Write-Host $r
          if (-not $r.StartsWith("OK")) { throw "Self-test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: PCS-Scanner-${{ env.VERSION }}
          path: dist/PCS-Scanner.exe

      - name: Publish release
        if: env.RELEASE == 'True'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: PCS Scanner ${{ env.VERSION }}
          files: dist/PCS-Scanner.exe
          generate_release_notes: true
