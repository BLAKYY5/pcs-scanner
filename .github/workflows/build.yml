name: Build PCS Scanner

# Every push to main builds the app (download it from the run's "Artifacts").
# Pushing a tag like v1.7.0 also publishes a release, which the app offers to players as an update.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller==6.10.0

      - name: Get ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffx
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Get-ChildItem -Recurse ffx -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination ffmpeg

      - name: Write build settings (version, Google sign-in ID, coach)
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
          COACH_EMAIL: ${{ vars.COACH_EMAIL }}
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { "dev-${{ github.run_number }}" }
          @{ version = $ver; repo = "${{ github.repository }}"; coach = $env:COACH_EMAIL } | ConvertTo-Json | Set-Content -Encoding utf8 build.json
          if ($env:GOOGLE_OAUTH_CLIENT) { $env:GOOGLE_OAUTH_CLIENT | Set-Content -Encoding utf8 client.json } else { Write-Warning "No GOOGLE_OAUTH_CLIENT secret: the app will scan but cannot upload." }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build the .exe
        shell: pwsh
        run: |
          $data = @("scanner/pcs_maps.json;.", "scanner/pcs_fonts.json;.", "scanner/rank_rp.npy;.", "build.json;.", "ffmpeg;ffmpeg")
          if (Test-Path client.json) { $data += "client.json;." }
          $args = @("--noconfirm", "--onefile", "--windowed", "--name", "PCS-Scanner", "--paths", "scanner", "--hidden-import", "pcs_scan", "--hidden-import", "pcs_hud")
          foreach ($d in $data) { $args += @("--add-data", $d) }
          pyinstaller @args app/pcs_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: PCS-Scanner-${{ env.VERSION }}
          path: dist/PCS-Scanner.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PCS-Scanner.exe
          generate_release_notes: true
