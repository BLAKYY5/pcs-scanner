name: Build PCS Scanner

# Every push to main builds the app. The version comes from VERSION in scanner/pcs_scan.py:
# if no release exists yet for that version, the build publishes one (tag v<version>),
# and players' apps offer it as an update. Same version again = test build only (see the run's "Artifacts").
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.8

      # A fixed ffmpeg, checked by its SHA-256: the scanner parses ffmpeg's text output (pts_time) and relies on its GPU
      # decoding, so every build ships the same one. BtbN keeps its month-end builds; the daily ones are deleted after
      # about two weeks. To bump: see "ffmpeg" in CLAUDE.md.
      - name: Get ffmpeg
        shell: pwsh
        env:
          FFMPEG_TAG: autobuild-2026-10-31-12-59
          FFMPEG_ZIP: ffmpeg-N-128227-g4811625b5f-win64-gpl.zip
          FFMPEG_SHA256: 3a5cdb3b83dd1b62b29d946d3655a14d787e5e81d947ad68202a1a400095d2f8
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_TAG/$env:FFMPEG_ZIP" -OutFile ffmpeg.zip
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { throw "ffmpeg.zip SHA-256 is $hash, expected $env:FFMPEG_SHA256" }
          Expand-Archive ffmpeg.zip -DestinationPath ffx
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Get-ChildItem -Recurse ffx -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination ffmpeg

      - name: Test auto-record logic and the window's server (fake OBS and game, real process pausing on Windows)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\ffmpeg;$env:PATH"
          python tests/test_recorder.py
          if ($LASTEXITCODE) { exit 1 }
          python tests/test_ui.py
          if ($LASTEXITCODE) { exit 1 }

      - name: Write build settings (version, Google sign-in ID)
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $code = (Select-String -Path scanner/pcs_scan.py -Pattern "^VERSION = '(.+)'").Matches[0].Groups[1].Value
          $exists = $true
          try { Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$code" | Out-Null } catch { $exists = $false }
          $release = ((-not $exists) -and ("${{ github.ref_name }}" -eq "main")) -or ("${{ github.ref_type }}" -eq "tag")
          $ver = if ($release) { $code } else { "dev-${{ github.run_number }}" }
          "RELEASE=$release" | Out-File -FilePath $env:GITHUB_ENV -Append
          @{ version = $ver; base = $code; repo = "${{ github.repository }}" } | ConvertTo-Json | Set-Content -Encoding utf8 build.json
          if ($env:GOOGLE_OAUTH_CLIENT) { $env:GOOGLE_OAUTH_CLIENT | Set-Content -Encoding utf8 client.json } else { Write-Warning "No GOOGLE_OAUTH_CLIENT secret: the app will scan but cannot upload." }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build the .exe
        shell: pwsh
        run: |
          $data = @("app/web;web", "app/assets;assets", "scanner/pcs_maps.json;.", "scanner/pcs_fonts.json;.", "scanner/pcs_banner.json;.", "scanner/pcs_ranked.json;.", "scanner/rank_rp.npy;.", "build.json;.", "ffmpeg;ffmpeg")
          if (Test-Path client.json) { $data += "client.json;." }
          $args = @("--noconfirm", "--onefile", "--windowed", "--name", "PCS-Scanner", "--icon", "app/assets/pcs.ico", "--paths", "scanner", "--hidden-import", "pcs_scan", "--hidden-import", "pcs_hud", "--hidden-import", "pcs_audio", "--hidden-import", "pcs_ring", "--hidden-import", "pcs_respawn", "--hidden-import", "pcs_minimap", "--hidden-import", "pcs_bars", "--hidden-import", "pcs_mapicons", "--hidden-import", "pcs_usage", "--hidden-import", "pcs_fights", "--hidden-import", "pcs_ranked", "--collect-submodules", "scipy.signal", "--collect-submodules", "numpy", "--collect-submodules", "scipy.ndimage", "--collect-all", "webview", "--hidden-import", "pystray._win32", "--collect-submodules", "pcs_recorder", "--hidden-import", "pcs_recorder.hub", "--hidden-import", "pcs_recorder.notes", "--hidden-import", "pcs_recorder.watch", "--hidden-import", "pcs_recorder.talk", "--hidden-import", "pcs_recorder.minimaps", "--hidden-import", "pcs_recorder.hubbackup", "--hidden-import", "websocket", "--hidden-import", "pcs_recorder.crash", "--hidden-import", "pcs_recorder.squadpaths", "--hidden-import", "pcs_recorder.weaponicons", "--hidden-import", "pcs_recorder.teamtracks", "--hidden-import", "pcs_recorder.stitch", "--hidden-import", "pcs_recorder.precheck", "--hidden-import", "pcs_recorder.serverscan", "--hidden-import", "pcs_recorder.clips", "--paths", "app")
          foreach ($d in $data) { $args += @("--add-data", $d) }
          pyinstaller @args app/pcs_app.py

      - name: Test the .exe (libraries load, ffmpeg and sign-in ID bundled)
        shell: pwsh
        run: |
          Start-Process -FilePath dist/PCS-Scanner.exe -ArgumentList "--selftest", "$PWD\selftest.txt" -Wait
          $r = Get-Content selftest.txt -Raw
          Write-Host $r
          if (-not $r.StartsWith("OK")) { throw "Self-test failed" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: PCS-Scanner-${{ env.VERSION }}
          path: dist/PCS-Scanner.exe

      - name: Publish release
        if: env.RELEASE == 'True'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: PCS Scanner ${{ env.VERSION }}
          files: dist/PCS-Scanner.exe
          generate_release_notes: true
